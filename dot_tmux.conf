# ============================================================
# ~/.tmux.conf
# 激活方式见文件末尾注释
# ============================================================

# ---------- 基础体验 ----------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g display-time 2000

# 窗口名不被自动改写
set -g allow-rename off
setw -g automatic-rename off

# 终端标题
set -g set-titles on
set -g set-titles-string "#S:#I #W"

# ---------- 终端 & 真彩色 ----------
# tmux-256color 在老 ncurses（CentOS 7 等）上不存在，自动降级
if-shell "infocmp tmux-256color > /dev/null 2>&1" \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# tmux >= 3.2 用 terminal-features；旧版回退到 terminal-overrides
if-shell '[ "$(tmux -V | sed "s/[^0-9.]//g" | cut -d. -f1)" -ge 3 ]' \
  'set -as terminal-features ",xterm-256color:RGB"' \
  'set -ga terminal-overrides ",xterm-256color:Tc"'

# ---------- locale ----------
# 用 C.UTF-8 而非 zh_CN.UTF-8：绝大多数服务器镜像没生成后者，
# 会导致每个新 shell 打 locale 警告并回退。C.UTF-8 中文照常显示。
set-environment -g LANG C.UTF-8
set-environment -g LC_ALL C.UTF-8

# ---------- 分屏 / 按键 ----------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"   # 左右分屏
bind - split-window -v -c "#{pane_current_path}"   # 上下分屏
bind c new-window -c "#{pane_current_path}"

# 切换窗格（prefix + hjkl，不抢 vim 的 Alt 键）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 调整窗格大小（可连按，见文末 repeat-time）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+数字 快速切窗口
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# 重载配置
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# ---------- 复制模式 ----------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi r send -X rectangle-toggle
# 注意：不手动绑定 y。tmux-yank 在 TPM 加载时会接管它，
# 并自动处理 macOS / Linux / WSL / SSH(OSC52) 四种剪贴板。

# ---------- 状态栏（Catppuccin Mocha） ----------
set -g status-position bottom
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#f9e2af,fg=#1e1e2e,bold"

set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]#[default]"

set -g status-right-length 100
set -g status-right "#[fg=#f9e2af]#{?client_prefix,PREFIX,} #[fg=#a6e3a1]%Y-%m-%d #[fg=#89dceb]%H:%M #[bg=#89b4fa,fg=#1e1e2e,bold] #h "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#f38ba8,fg=#1e1e2e,bold] #I:#W "
setw -g window-status-activity-style "fg=#f9e2af"

# ---------- 插件 ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + Ctrl-s 保存 / Ctrl-r 恢复
set -g @plugin 'tmux-plugins/tmux-continuum'   # 定时自动保存
set -g @plugin 'tmux-plugins/tmux-yank'

# 只恢复布局，不抓 pane 内容 —— 抓内容会让每次保存和冷启动明显卡顿。
# 如果确实需要恢复屏幕内容，改成 'on' 并把 save-interval 拉到 30。
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '30'

# 初始化 TPM（必须在所有 @plugin 之后）
run '~/.tmux/plugins/tpm/tpm'

# ============================================================
# ---------- TPM 之后的覆盖 ----------
# tmux-sensible 是后加载的，会覆盖前面写的同名选项。
# 想让个人设置生效，必须放在 run 这一行之后。
# ============================================================

# escape-time 是 server 选项，必须用 -s。
# sensible 设成 0；但 0 在高延迟 SSH 下会把方向键的转义序列拆散成乱码，
# 10ms 既没有 ESC 延迟感，又留了拼包余量。
set -s escape-time 10

# repeat-time 是 session 选项，用 -g（不是 -sg）。
# sensible 默认 600ms 太长：按完 prefix+H 之后 600ms 内敲的 h/j/k/l
# 都会被当成 resize 吞掉，手快时表现为"丢字符"。
set -g repeat-time 300

set -g history-limit 50000
set -g status-interval 5